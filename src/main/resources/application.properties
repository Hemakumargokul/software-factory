# Pinned service port: the factory's acceptance harness polls this port,
# and 8080 is commonly occupied on developer machines.
server.port=8188
management.endpoints.web.exposure.include=health

# Embedded H2, in-memory for the lifetime of the running application. The
# DB_CLOSE_DELAY=-1 flag keeps the in-memory database alive for as long as the
# JVM runs (rather than being torn down when the last connection closes),
# so data persists across requests within the same application instance.
spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
