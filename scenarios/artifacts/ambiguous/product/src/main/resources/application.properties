# Pinned service port: the factory's acceptance harness polls this port,
# and 8080 is commonly occupied on developer machines.
server.port=8188
management.endpoints.web.exposure.include=health

# Embedded H2, file-based so that URL mappings and click stats persist across
# application restarts (rather than living only in JVM memory). The database
# file lives under ./data, created relative to the working directory the app
# is launched from; AppApplication.main wires DataDirectorySupport to create
# that directory (via mkdirs) before the datasource attempts to open it.
# AUTO_SERVER=TRUE allows multiple local connections (e.g. an H2 console or a
# second process) to attach to the same file without lock contention.
spring.datasource.url=jdbc:h2:file:./data/urlshortener;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# "update" (not create-drop) so the schema is migrated in place on startup
# without dropping existing rows, preserving previously persisted mappings
# and click counts across restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
