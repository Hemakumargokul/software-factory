# Test-only overrides: use an isolated in-memory H2 instance per JVM so tests
# never contend with the file-based database used by the running application,
# and each test run starts from a clean schema.
spring.datasource.url=jdbc:h2:mem:urlshortener-test-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
