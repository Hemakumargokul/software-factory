# Pinned service port: the factory's acceptance harness polls this port,
# and 8080 is commonly occupied on developer machines.
server.port=8188
management.endpoints.web.exposure.include=health

# Embedded H2, file-based so data survives restarts within the same working directory.
spring.datasource.url=jdbc:h2:file:./data/urlshortener;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
